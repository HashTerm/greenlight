# Greenlight docs — Dokploy prod (Swarm).
# Requires GREENLIGHT_DOCS_IMAGE (GHCR).
#
# Dokploy deploy command:
#   stack deploy -c ./docker-compose.docs.stack.yml "${COMPOSE_PROJECT_NAME}" --with-registry-auth --prune
#
# Standalone docs site (no gateway / Postgres).
#
# Compose (non-Swarm) alternatives:
#   docker compose -f docker-compose.docs.yml --env-file .env.docs up -d
#   docker compose -f docker-compose.docs.build.yml --env-file .env.docs up -d --build
#
# Ingress: greenlight-docs:3003
#
# No custom networks — services use the stack default network (Dokploy-friendly).

services:
  greenlight-docs:
    image: ${GREENLIGHT_DOCS_IMAGE:-ghcr.io/HashTerm/greenlight-docs:latest}
    expose:
      - '3003'
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 20
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        max_failure_ratio: 0
        order: start-first
