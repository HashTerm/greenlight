# Standalone docs — GHCR image (Dokploy / Coolify).
#
#   docker compose -f docker-compose.docs.yml --env-file .env.docs up -d
#
# Swarm: docker-compose.docs.stack.yml
#
# Ingress: route public docs URL → greenlight-docs:3003

services:
  greenlight-docs:
    image: ${GREENLIGHT_DOCS_IMAGE:-ghcr.io/HashTerm/greenlight-docs:latest}
    restart: unless-stopped
    expose:
      - '3003'
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
