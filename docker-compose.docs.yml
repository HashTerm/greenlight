# Optional docs overlay — merge with docker-compose.self-host.yml:
#   docker compose -f docker-compose.self-host.yml -f docker-compose.docs.yml \
#     --env-file .env.self-host --env-file .env.docs up -d
#
# Swarm: use docker-compose.self-host.stack.yml (includes greenlight-docs)
#
# Ingress: route public docs URL → greenlight-docs:3003

services:
  greenlight-docs:
    image: ${GREENLIGHT_DOCS_IMAGE:-ghcr.io/markokosticdev/greenlight-docs:latest}
    restart: unless-stopped
    expose:
      - '3003'
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
