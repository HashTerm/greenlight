# Standalone docs — build on server (Dokploy / Coolify) without GHCR images.
# Compose path: docker-compose.docs.build.yml
#
#   docker compose -f docker-compose.docs.build.yml --env-file .env.docs up -d --build
#
# Ingress: route public docs URL → greenlight-docs:3003
#
# For pre-built GHCR docs image alongside the gateway stack, use docker-compose.docs.yml
# merged with docker-compose.self-host.yml instead.

services:
  greenlight-docs:
    build:
      context: .
      dockerfile: docs-site/Dockerfile
    restart: unless-stopped
    expose:
      - '3003'
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
