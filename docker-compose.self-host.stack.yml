# Swarm / stack overrides — merge with docker-compose.self-host.yml:
#   docker stack deploy -c docker-compose.self-host.yml -c docker-compose.self-host.stack.yml greenlight
#
# With docs:
#   docker stack deploy -c docker-compose.self-host.yml -c docker-compose.docs.yml -c docker-compose.self-host.stack.yml greenlight
#
# Label a node for Postgres data (recommended):
#   docker node update --label-add greenlight.db=true <node-id>

networks:
  greenlight:
    driver: overlay
    attachable: true

services:
  greenlight:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 20
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  greenlight-ui:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 20
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  postgres:
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.greenlight.db == true
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
