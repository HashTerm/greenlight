# Local development Compose.
#
# Default (hybrid): Postgres only — run apps with npm (npm run dev)
#   docker compose up -d
#
# Full containerized stack (smoke / no Node on host):
#   docker compose --profile full up -d --build

services:
  greenlight:
    profiles: [full]
    build: ./core
    container_name: greenlight-dev
    restart: unless-stopped
    ports:
      - '8100:8100'
    env_file: .env
    environment:
      USE_AUTH: 'true'
      API_KEY: ${API_KEY}
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN}
      # Override host-side localhost URL from .env for in-network access
      DATABASE_URL: postgresql://greenlight:greenlight@postgres:5432/greenlight
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8100/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  greenlight-ui:
    profiles: [full]
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: greenlight-ui-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      PORT: '3000'
      GREENLIGHT_API_URL: http://greenlight:8100
      GREENLIGHT_API_KEY: ${API_KEY}
      GREENLIGHT_ADMIN_TOKEN: ${ADMIN_INTERNAL_TOKEN}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL}
      DATABASE_URL: postgresql://greenlight:greenlight@postgres:5432/greenlight
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
    depends_on:
      greenlight:
        condition: service_healthy

  greenlight-docs:
    profiles: [full]
    build:
      context: .
      dockerfile: docs-site/Dockerfile
    container_name: greenlight-docs-dev
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-http://localhost:3001}

  postgres:
    image: postgres:16-alpine
    container_name: greenlight-postgres-dev
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: greenlight
      POSTGRES_PASSWORD: greenlight
      POSTGRES_DB: greenlight
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenlight -d greenlight']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
