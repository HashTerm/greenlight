# Local development Compose.
#
# Project name is fixed so this stack never collides with other local apps
# (greenlight-website-dev, hashterm-website-dev, …) on the same Docker daemon.
#
# Host ports (local hybrid dev):
#   Admin UI  → 3001  (hashterm :3000, website :3002, docs :3003)
#   Docs      → 3003
#   Postgres  → 5431  (hashterm :5430, website :5432)
#   docker compose up -d
#
# Full containerized stack (smoke / no Node on host):
#   docker compose --profile full up -d --build

name: greenlight-dev

services:
  greenlight:
    profiles: [full]
    build: ./core
    restart: unless-stopped
    ports:
      - '8100:8100'
    env_file: .env
    environment:
      USE_AUTH: 'true'
      GREENLIGHT_API_KEY: ${GREENLIGHT_API_KEY}
      GREENLIGHT_LICENSE: ${GREENLIGHT_LICENSE:-}
      GREENLIGHT_LICENSE_FILE: ${GREENLIGHT_LICENSE_FILE:-}
      GREENLIGHT_LICENSE_CUSTOMER_ID: ${GREENLIGHT_LICENSE_CUSTOMER_ID:-}
      GREENLIGHT_LICENSE_STRICT: ${GREENLIGHT_LICENSE_STRICT:-}
      LICENSING_URL: ${LICENSING_URL:-}
      # Override host-side localhost URL from .env for in-network access
      DATABASE_URL: postgresql://greenlight:greenlight@postgres:5432/greenlight
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8100/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  greenlight-ui:
    profiles: [full]
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: .env
    environment:
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      GREENLIGHT_API_URL: http://greenlight:8100
      GREENLIGHT_API_KEY: ${GREENLIGHT_API_KEY}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL}
      DATABASE_URL: postgresql://greenlight:greenlight@postgres:5432/greenlight
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: 'true'
    depends_on:
      greenlight:
        condition: service_healthy

  greenlight-docs:
    profiles: [full]
    build:
      context: .
      dockerfile: docs-site/Dockerfile
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-http://localhost:3003}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5431}:5432'
    environment:
      POSTGRES_USER: greenlight
      POSTGRES_PASSWORD: greenlight
      POSTGRES_DB: greenlight
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenlight -d greenlight']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
