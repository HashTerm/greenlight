name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [enterprise-updated]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORM_REPO: HashTerm/greenlight-platform

jobs:
  greenlight-core:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: greenlight
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.greenlight_ref || 'main') || github.ref }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PLATFORM_REPO }}
          path: greenlight-platform
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.platform_ref || 'main') || 'main' }}
          token: ${{ secrets.GREENLIGHT_PLATFORM_PAT }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/greenlight
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: greenlight-platform/enterprise/docker/Dockerfile.inject
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=greenlight
          cache-to: type=gha,mode=max,scope=greenlight

  greenlight-core-community:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./core
          file: ./core/Dockerfile
          push: false
          cache-from: type=gha,scope=greenlight-community
          cache-to: type=gha,mode=max,scope=greenlight-community

  greenlight-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: greenlight
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.greenlight_ref || 'main') || github.ref }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PLATFORM_REPO }}
          path: greenlight-platform
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.platform_ref || 'main') || 'main' }}
          token: ${{ secrets.GREENLIGHT_PLATFORM_PAT }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/greenlight-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: greenlight-platform/enterprise/docker/Dockerfile.ui.inject
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=greenlight-ui
          cache-to: type=gha,mode=max,scope=greenlight-ui

  greenlight-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: greenlight
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.greenlight_ref || 'main') || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/greenlight-docs
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: greenlight
          file: greenlight/docs-site/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=greenlight-docs
          cache-to: type=gha,mode=max,scope=greenlight-docs
