name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.self-host.yml --env-file .env.self-host.example config --quiet
      - run: docker compose -f docker-compose.docs.yml --env-file .env.docs.example config --quiet
      - run: docker compose -f docker-compose.docs.build.yml --env-file .env.docs.example config --quiet
      - run: docker compose -f docker-compose.docs.stack.yml --env-file .env.docs.example config --quiet
      - run: npm test
      - run: npm run build
